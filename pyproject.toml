[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "investment-evidence-engine"
version = "0.1.0"
description = "Public-data evidence acquisition, compute and visualization executor for touzizhuanjia"
requires-python = ">=3.11"
dependencies = [
  "akshare",
  "baostock",
  "matplotlib",
  "mplfinance",
  "numpy",
  "pandas",
  "pydantic>=2",
  "pypdf",
  "PyYAML",
  "tushare",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
investment-evidence-engine = "investment_evidence_engine.runner:main"

[tool.hatch.build.targets.wheel]
packages = ["src/investment_evidence_engine"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
# Keep CI focused on syntax/correctness, imports and Python modernization. Provider/worker code
# intentionally catches third-party exceptions so external failures become structured evidence.
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/investment_evidence_engine/workers.py" = ["I001", "UP035"]
"src/investment_evidence_engine/research_compute.py" = ["F401", "UP035"]
