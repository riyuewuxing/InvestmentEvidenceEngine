name: Public relisting identity evidence
on:
  push:
    paths:
      - ".github/workflows/public-relisting-control.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-relisting-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e ".[dev]"
      - name: Fixed listing lifecycle and vendor windows
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=5s 220s python -m investment_evidence_engine.public_relisting_control
