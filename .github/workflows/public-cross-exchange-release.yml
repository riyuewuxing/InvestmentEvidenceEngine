name: Public cross-exchange release-time diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-cross-exchange-release.yml'
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 150s python -m investment_evidence_engine.cross_exchange_release_control --hk-only
        timeout-minutes: 3
