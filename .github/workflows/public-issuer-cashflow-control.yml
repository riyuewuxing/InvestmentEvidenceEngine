name: Public issuer official mirrors and cashflow
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-issuer-cashflow-control.yml'
      - 'scripts/public_issuer_cashflow_control.py'
permissions:
  contents: read
concurrency:
  group: public-issuer-cashflow-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Bounded second official host and consolidated pages
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 155s python scripts/public_issuer_cashflow_control.py
