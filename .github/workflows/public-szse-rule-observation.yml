name: Public SZSE rule observation
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-szse-rule-observation.yml'
permissions:
  contents: read
concurrency:
  group: public-szse-rule-observation
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe relocated 2023 archived rule only
        run: timeout --signal=TERM --kill-after=5s 100s python scripts/public_szse_rule_observation.py --archived-2023
        timeout-minutes: 3
