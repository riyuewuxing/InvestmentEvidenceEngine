name: Public SSE retrospective factbook diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-sse-factbook.yml'
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Reconcile directory dates only (no repeat PDF)
        run: timeout --signal=TERM --kill-after=5s 205s python -m investment_evidence_engine.sse_factbook_control --directory-only
        timeout-minutes: 4

