name: Public symbol-change boundary evidence
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-symbol-change-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e ".[dev]"
      - name: Observe fixed official notice and vendor code-boundary windows
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 150s python -m investment_evidence_engine.public_symbol_change_control
