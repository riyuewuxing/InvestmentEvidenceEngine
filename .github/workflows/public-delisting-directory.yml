name: Public delisting directory coverage
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-delisting-directory
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Exact prior SSE body only, exclude every ambiguous key row
        env:
          DELIST_EXPECTED_SSE_SHA256: d5e5dec58882aef4aba8be707087e9c3483ee1be9c2d1fcb6070e1ae9abc8990
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 80s python -m investment_evidence_engine.delisting_directory
