name: Public actual research chain
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-actual-research-chain.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-actual-research-chain
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Real scan packet and same candidate research worker
        timeout-minutes: 5
        run: timeout --signal=TERM --kill-after=5s 265s python scripts/public_actual_research_chain.py
