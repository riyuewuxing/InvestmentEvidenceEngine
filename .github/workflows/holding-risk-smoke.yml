name: Bounded public holding-period and calendar smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/holding-risk-smoke.yml'
      - 'scripts/holding_risk_smoke.py'
      - 'src/investment_evidence_engine/holding_risk.py'
      - 'src/investment_evidence_engine/market_calendar.py'
      - 'src/investment_evidence_engine/historical_receipt.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holding-risk-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-controls:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Real calendar and cash-distribution observation
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=5s 195s python scripts/holding_risk_smoke.py
