name: Public issuer Q3 additional financial reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-issuer-q3-pressure.yml'
      - 'scripts/public_issuer_q3_pressure.py'
permissions:
  contents: read
concurrency:
  group: public-issuer-q3-pressure
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Bounded Q3 additional pages
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 80s python scripts/public_issuer_q3_pressure.py
