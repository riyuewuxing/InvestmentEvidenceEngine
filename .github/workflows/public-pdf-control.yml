name: Public official PDF transport control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-pdf-control.yml'
      - 'scripts/public_pdf_control.py'
permissions:
  contents: read
jobs:
  control:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Observe fixed public PDF
        timeout-minutes: 1
        run: timeout --signal=TERM --kill-after=5s 45s python scripts/public_pdf_control.py
