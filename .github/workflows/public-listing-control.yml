name: Public listing code-set control
on:
  push:
    branches: [main]
    paths:
      - 'scripts/public_listing_control.py'
      - '.github/workflows/public-listing-control.yml'
permissions:
  contents: read
concurrency:
  group: public-listing-code-set-control
  cancel-in-progress: true
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: One bounded reference then one snapshot only when reference is usable
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 155s python scripts/public_listing_control.py
