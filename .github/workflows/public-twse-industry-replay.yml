name: Public TWSE retained industry replay
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-twse-industry-replay.yml"
permissions:
  contents: read
concurrency:
  group: public-twse-industry-replay
  cancel-in-progress: false
jobs:
  replay:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Actual retained-byte sealed request and before-cutoff rejection
        timeout-minutes: 1
        run: timeout --signal=TERM --kill-after=5s 45s python scripts/public_twse_industry_replay.py
