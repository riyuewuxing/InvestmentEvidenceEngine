name: Public regulatory transport control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-regulatory-control.yml'
      - 'scripts/public_regulatory_control.py'
permissions:
  contents: read
jobs:
  control:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    strategy:
      fail-fast: false
      matrix:
        source: [SSE_TRADING_RULES_2026, SZSE_TRADING_RULES_2026, CSRC_PUBLIC_FUND_OPERATION_RULES]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Observe fixed official source
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 85s python scripts/public_regulatory_control.py ${{ matrix.source }}
