name: Supplemental public pilot raw input audit
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospective-control-input-audit-20261127.yml'
permissions:
  contents: read
jobs:
  audit:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Observe five already frozen public input dates
        timeout-minutes: 1
        run: timeout --signal=TERM --kill-after=5s 45s python scripts/public_pilot_input_audit.py
