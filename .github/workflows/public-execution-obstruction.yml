name: Public execution obstruction
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-execution-obstruction.yml'
permissions:
  contents: read
concurrency:
  group: public-execution-obstruction
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe daily status and compare conditional price limits
        run: timeout --signal=TERM --kill-after=5s 100s python scripts/public_execution_obstruction.py
        timeout-minutes: 3
