name: Public dividend tax tier control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-dividend-tax
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe policy and apply uniform nominal tax tiers to retained derived receipt
        run: timeout --signal=TERM --kill-after=5s 75s python -m investment_evidence_engine.dividend_tax_control
        timeout-minutes: 3
