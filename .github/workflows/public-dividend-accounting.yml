name: Public dividend accounting control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-dividend-accounting.yml'
permissions:
  contents: read
concurrency:
  group: public-dividend-accounting-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe five fixed issuer disclosures and preserve amount differences
        run: timeout --signal=TERM --kill-after=5s 210s python -m investment_evidence_engine.dividend_accounting_control
        timeout-minutes: 4
