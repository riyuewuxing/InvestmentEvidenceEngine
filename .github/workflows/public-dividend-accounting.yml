name: Public dividend accounting control
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-dividend-accounting-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Reobserve exact prior approval version only and reconcile four retained receipts
        run: timeout --signal=TERM --kill-after=5s 210s python -m investment_evidence_engine.dividend_accounting_control --approval-2025-only
        timeout-minutes: 4
