name: Public Common Crawl historical witness
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-common-crawl-witness
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Fixed independent archive observation (no denial retry)
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=5s 180s python -m investment_evidence_engine.common_crawl_witness
