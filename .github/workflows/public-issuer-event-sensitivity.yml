name: Public issuer event sensitivity
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-issuer-event-sensitivity.yml'
      - 'scripts/public_issuer_event_sensitivity.py'
permissions:
  contents: read
concurrency:
  group: public-issuer-event-sensitivity
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Fixed event sensitivity
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 135s python scripts/public_issuer_event_sensitivity.py
