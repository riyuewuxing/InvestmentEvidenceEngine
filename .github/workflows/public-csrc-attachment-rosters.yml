name: Public CSRC historical roster attachments
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine
        run: python -m pip install -e .
        timeout-minutes: 4
      - name: Inspect unresolved same-version Jiangxi worksheet structure
        env:
          CSRC_JIANGXI_ONLY: '1'
        run: timeout --signal=TERM --kill-after=5s 195s python -m investment_evidence_engine.csrc_attachment_roster_control
        timeout-minutes: 4

# Retry only after exact publisher-path mismatch repair.
