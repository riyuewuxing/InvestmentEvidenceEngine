name: Public momentum entitlement sensitivity
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-momentum-entitlement.yml'
permissions:
  contents: read
concurrency:
  group: public-momentum-entitlement
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Reobserve exact projection and calculate new entitlement sensitivity
        run: timeout --signal=TERM --kill-after=5s 100s python scripts/public_momentum_entitlement.py
        timeout-minutes: 3
