name: Public market cutoff observation

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-market-cutoff-control.yml'
      - 'scripts/public_market_cutoff_control.py'

permissions:
  contents: read

concurrency:
  group: public-market-cutoff-control
  cancel-in-progress: false

jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Observe once through production dispatcher
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 130s python scripts/public_market_cutoff_control.py
