name: Public retrospective price control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-retrospective-control.yml'
      - 'scripts/public_retrospective_control.py'
permissions:
  contents: read
concurrency:
  group: public-retrospective-price-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: One actual bounded two-provider control
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s python scripts/public_retrospective_control.py
