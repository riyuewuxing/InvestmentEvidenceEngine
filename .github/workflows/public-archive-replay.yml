name: Public retained archive replay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-archive-replay.yml'
      - 'scripts/replay_bls_archive.py'
permissions:
  contents: read
concurrency:
  group: public-archive-replay
  cancel-in-progress: false
jobs:
  replay:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Offline exact retained bytes and two-clock replay
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 60s python scripts/replay_bls_archive.py
