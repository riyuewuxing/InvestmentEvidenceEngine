name: Public fund product identity controls
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-fund-identity-control.yml"
permissions:
  contents: read
concurrency:
  group: public-fund-identity-control
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe fixed official product metadata
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s python -m investment_evidence_engine.public_fund_identity_control
