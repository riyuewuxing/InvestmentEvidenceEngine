name: Public BLS exact archive retention
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-bls-archive-retention
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Fixed bounded archive observation
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 60s python scripts/public_bls_archive_retention.py
