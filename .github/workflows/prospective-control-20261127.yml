name: Public prospective control pilot 20261127
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prospective-control-20261127.yml'
permissions:
  contents: read
concurrency:
  group: public-prospective-control-20261127
  cancel-in-progress: false
jobs:
  freeze:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e ".[dev]"
      - name: Control contract checks
        timeout-minutes: 1
        run: python -m pytest -q tests/test_public_prediction_pilot.py
      - name: Freeze first prospective public observation
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 120s python -m investment_evidence_engine.public_prediction_pilot
