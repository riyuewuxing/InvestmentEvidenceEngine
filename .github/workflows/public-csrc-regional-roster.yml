name: Public CSRC retrospective regional roster diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install engine
        run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe bounded source
        run: timeout --signal=TERM --kill-after=5s 60s python -m investment_evidence_engine.csrc_regional_roster_control
        timeout-minutes: 2
