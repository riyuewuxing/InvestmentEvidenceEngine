name: Public current-case review boundary replay
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-case-review-boundary.yml'
      - 'src/investment_evidence_engine/review_boundary.py'
      - 'scripts/public_case_review_boundary.py'
permissions:
  contents: read
jobs:
  replay:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 30s python scripts/public_case_review_boundary.py
        timeout-minutes: 1
