name: Public current alternative one-route supplement
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-current-etf-supplement.yml'
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 80s python -m investment_evidence_engine.public_current_research_price --alternative-supplement
        timeout-minutes: 2
