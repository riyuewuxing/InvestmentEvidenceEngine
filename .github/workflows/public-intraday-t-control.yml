name: Public intraday T close reference
on:
  workflow_dispatch:
  push:
    paths:
      - "scripts/public_intraday_t_control.py"

permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e . 'akshare==1.20.70'
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 90s python scripts/public_intraday_t_control.py
        timeout-minutes: 2
