name: Bounded public financial transport control
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bounded-provider-control.yml'
permissions:
  contents: read
jobs:
  control:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Observe fixed public control
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s python scripts/bounded_provider_control.py
