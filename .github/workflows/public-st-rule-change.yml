name: Public ST rule change diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-st-rule-change.yml'

permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 115s python scripts/public_st_rule_change.py
        timeout-minutes: 3

# Targeted same-source correction for suspended row missingness and exact notice rehash.
