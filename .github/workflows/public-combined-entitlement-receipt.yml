name: Public combined entitlement receipt diagnostic
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/public-combined-entitlement-receipt.yml'
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 185s python scripts/public_combined_entitlement_receipt.py
        timeout-minutes: 4
