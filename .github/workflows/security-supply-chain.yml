name: Security and supply chain

on:
  workflow_dispatch:
  schedule:
    - cron: "43 2 * * 1"
  push:
    paths:
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/security-supply-chain.yml"

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
      - name: Install engine and security tools
        run: |
          python -m pip install -e ".[dev]"
          python -m pip install detect-secrets pip-audit cyclonedx-bom
          python -m pip install -U "setuptools>=83"
      - name: Secret scan
        run: |
          detect-secrets scan --all-files \
            --exclude-files '(^|/)\.git/' \
            > detect-secrets.json
      - name: Semantic secret triage
        run: |
          set +e
          python -m investment_evidence_engine.security_gate \
            detect-secrets.json \
            --repo-root . \
            --report security-triage.json
          triage_exit=$?
          set -e
          echo "semantic_triage_exit=$triage_exit"
      - name: Dependency snapshot and SBOM
        run: |
          python -m pip freeze > dependency-snapshot.txt
          cyclonedx-py environment --output-format JSON --output-file sbom.cdx.json
      - name: Dependency vulnerability audit
        shell: bash
        run: |
          set +e
          python -m pip_audit --format json --output pip-audit.json
          code=$?
          echo "$code" > pip-audit-exit-code.txt
          exit 0
      - name: Upload security evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: security-supply-chain-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            detect-secrets.json
            security-triage.json
            dependency-snapshot.txt
            sbom.cdx.json
            pip-audit.json
            pip-audit-exit-code.txt
          retention-days: 7
          if-no-files-found: error
      - name: Security gate
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          triage = json.loads(Path("security-triage.json").read_text(encoding="utf-8"))
          findings = int(triage.get("secret_findings", 0))
          unexpected = len(triage.get("unexpected", []))
          audit_exit = int(Path("pip-audit-exit-code.txt").read_text(encoding="utf-8").strip())
          audit = json.loads(Path("pip-audit.json").read_text(encoding="utf-8"))
          vulnerabilities = sum(len(item.get("vulns", [])) for item in audit.get("dependencies", []))
          print({"secret_findings": findings, "unexpected_secret_findings": unexpected, "pip_audit_exit": audit_exit, "vulnerabilities": vulnerabilities})
          if unexpected or triage.get("status") != "PASS":
              raise SystemExit("untriaged secret findings remain")
          if audit_exit != 0 or vulnerabilities:
              raise SystemExit("dependency vulnerabilities remain")
          PY
