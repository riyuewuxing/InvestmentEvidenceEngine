name: Public SZSE historical roster reconciliation
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-szse-factbook-reconcile.yml'
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Check official market overview only
        env:
          SZSE_RECONCILE_MODE: MARKET_OVERVIEW_ONLY
        run: timeout --signal=TERM --kill-after=5s 355s python -m investment_evidence_engine.szse_factbook_reconcile
        timeout-minutes: 6
