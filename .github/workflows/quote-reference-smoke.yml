name: Bounded public live quote reference smoke
on:
  push:
    branches: [main]
    paths:
      - 'src/investment_evidence_engine/quote_reference.py'
      - 'src/investment_evidence_engine/quote_receipt.py'
      - 'scripts/quote_reference_smoke.py'
      - '.github/workflows/quote-reference-smoke.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-controls:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 3
        run: python -m pip install -e .
      - name: Fixed public top-of-book controls
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 90s python scripts/quote_reference_smoke.py
