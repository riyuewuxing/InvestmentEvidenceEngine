name: Public BSE code transition control
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-bse-code-transition.yml"
permissions:
  contents: read
concurrency:
  group: public-bse-code-transition
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Observe exact official code transition sources
        timeout-minutes: 2
        run: timeout --signal=TERM --kill-after=5s 100s python -m investment_evidence_engine.bse_code_transition_control
