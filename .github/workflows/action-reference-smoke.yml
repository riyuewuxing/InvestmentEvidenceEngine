name: Bounded public corporate action reconciliation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  public-controls:
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 3
        run: python -m pip install -e .
      - name: Bounded fixed stock corporate-action control
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 100s python scripts/action_reference_smoke.py
