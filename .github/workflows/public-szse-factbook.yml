name: Public SZSE historical factbook control
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-szse-factbook.yml'
permissions:
  contents: read
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - name: Observe bounded fixed yearbook and check ranking coverage
        run: timeout --signal=TERM --kill-after=5s 155s python -m investment_evidence_engine.szse_factbook_control
        timeout-minutes: 3
