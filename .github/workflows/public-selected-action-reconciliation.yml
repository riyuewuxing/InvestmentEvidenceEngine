name: Public selected action reconciliation
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/public-selected-action-reconciliation.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-selected-action-reconciliation
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Exact selected public action and calendar comparison
        timeout-minutes: 4
        run: timeout --signal=TERM --kill-after=5s 210s python scripts/public_selected_action_reconciliation.py
