name: Public current case price and issuer risk metadata
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  price:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 125s python -m investment_evidence_engine.public_current_research_price
        timeout-minutes: 3
  recent-risk:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -e .
        timeout-minutes: 4
      - run: timeout --signal=TERM --kill-after=5s 45s python scripts/public_recent_issuer_risk.py
        timeout-minutes: 1
