name: Public disclosure-directory and actual scan packet
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: public-disclosure-scan-packet
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == 1 }}
    runs-on: ubuntu-latest
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Conditional one real packet and selected price diagnostic
        timeout-minutes: 6
        run: timeout --signal=TERM --kill-after=5s 330s python scripts/public_disclosure_scan_packet.py
