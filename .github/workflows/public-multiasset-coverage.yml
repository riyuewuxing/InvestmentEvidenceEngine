name: Public multiasset vendor coverage
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/public-multiasset-coverage.yml"
permissions:
  contents: read
concurrency:
  group: public-multiasset-coverage
  cancel-in-progress: false
jobs:
  observe:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: Observe bounded vendor catalogs and return lenses
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 170s python -m investment_evidence_engine.public_multiasset_coverage

  stock-observation:
    if: ${{ github.event.repository.visibility == 'public' && github.run_attempt == '1' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: pip
      - name: Install public engine
        timeout-minutes: 4
        run: python -m pip install -e .
      - name: One same-day stock universe control
        timeout-minutes: 3
        run: timeout --signal=TERM --kill-after=5s 170s python scripts/public_universe_control.py
